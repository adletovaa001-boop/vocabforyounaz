function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");Object.assign(S,d.S||d);if(d.PR)PR=d.PR;Object.assign(CFG,d.CFG||{});PR.list[PR.id]=PR.list[PR.id]||{name:"Друг",av:"🦊"};const w=JSON.parse(localStorage.getItem(KEY+"_w")||"null");if(w){const o=Array.isArray(w)?{animals:w}:w;for(const k in o)if(U[k]&&o[k])U[k].words=o[k]}}catch(e){}}
function save(){try{chkB();S.U[S.unit]={pre:S.pre,post:S.post,stars:S.stars};Object.assign(PR.list[PR.id],Object.fromEntries(PF.map(k=>[k,S[k]])));const s=JSON.stringify({S,PR,CFG});localStorage.setItem(KEY,s);if(s.length>4e6)toast("⚠ Хранилище почти заполнено. Сохраните прогресс в файл (💾)")}catch(e){}}
function saveW(){try{U[S.unit].words=W.slice();localStorage.setItem(KEY+"_w",JSON.stringify(Object.fromEntries(Object.entries(U).map(([k,v])=>[k,v.words]))))}catch(e){toast("⚠ Нет места в хранилище")}}
const apply=()=>{const d=document.documentElement;d.dataset.m=S.mode;d.dataset.a=S.anim;d.lang=S.lang};

/* ===== ОЗВУЧКА: свой аудиофайл (поле audio) важнее синтеза речи ===== */
const voices=()=>{try{return speechSynthesis.getVoices()}catch(e){return[]}};
const canSay=l=>voices().some(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)));
function utter(txt,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function say(i,l){const x=W[i];if(l=="en"&&x.audio){try{new Audio(x.audio).play()}catch(e){}return}
  utter(x[l],{en:S.acc,ru:"ru-RU",kk:"kk-KZ"}[l])}
const sayP=i=>utter(P[i].en,S.acc);
// кнопки озвучки; если голоса нет — кнопка скрыта
const spk=x=>["en","ru","kk"].filter(l=>(l=="en"||S.hint=="both"||S.hint==l)&&((l=="en"&&x.audio)||canSay(l)))
  .map(l=>`<button class="sp" onclick="say(${W.indexOf(x)},'${l}')" aria-label="Audio ${l}">🔊${l=="en"?"":l=="ru"?" РУС":" ҚАЗ"}</button>`).join("");
let AC;const addX=n=>{S.xp+=n;S.dx[today()]=(S.dx[today()]||0)+n};const beep=ok=>{if(ok)addX(2);if(S.snd!="1"||S.mode!="fun")return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=ok?660:300;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}};

/* ===== РАЗДЕЛЫ ===== */
const $=s=>document.querySelector(s),app=$("#app"),paint=h=>app.innerHTML=h;
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const today=()=>Math.floor(Date.now()/864e5);
let cur=null;const show=f=>{clearInterval(TI);if(!/^(t|goT$)/.test(f.name))TOK=0;apply();cur=f;f();scrollTo(0,0)};
// маскот Фокси (SVG)
const fox=()=>`<svg viewBox="0 0 100 100" width="84" height="84" aria-hidden="true"><path d="M14 10l24 20H14zM86 10L62 30h24z" fill="#c2410c"/><circle cx="50" cy="55" r="36" fill="#ff8a3d"/><path d="M20 58q30 42 60 0q-30 12-60 0z" fill="#fff"/><circle cx="37" cy="48" r="5" fill="#17323a"/><circle cx="63" cy="48" r="5" fill="#17323a"/><ellipse cx="50" cy="62" rx="6" ry="4.5" fill="#17323a"/><path d="M39 72q11 9 22 0" stroke="#17323a" stroke-width="3" fill="none"/></svg>`;
const say2=x=>`<div class="say">${fox()}<div class="bub" role="status" id="bub">${x}</div></div>`;
const homeBtn=()=>`<button class="big" onclick="show(goUnit)">🏠 ${t("home")}</button>`;
function hdr(){$("#hd").innerHTML=`<button onclick="show(goHome)" aria-label="${t("home")}">🏠 ${t("home")}</button>
 <div class="seg" role="group" aria-label="Language">${[["en","EN"],["ru","РУС"],["kk","ҚАЗ"]].map(([l,n])=>`<button class="${S.lang==l?"on":""}" aria-pressed="${S.lang==l}" onclick="setL('${l}')">${n}</button>`).join("")}</div>
 <button onclick="show(goMe)" aria-label="${t("nm")}">${PR.list[PR.id].av}</button><button onclick="show(goSet)" aria-label="${t("set")}">⚙️</button>`}
function setL(l){S.lang=l;save();apply();hdr();if(cur)cur()}
const hints=x=>["ru","kk"].filter(l=>S.hint=="both"||S.hint==l).map(l=>`<div><span class="tag">${l=="ru"?"РУС":"ҚАЗ"}</span>${x[l]}</div>`).join("");
function confetti(){if(S.mode!="fun"||S.anim!="1"||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const c=document.createElement("div");c.className="conf";c.setAttribute("aria-hidden","true");const E=["🎉","⭐","🎈","✨"];
 c.innerHTML=Array.from({length:24},(_,i)=>`<i style="left:${Math.random()*95}%;animation-delay:${Math.random()}s">${E[i%4]}</i>`).join("");
 document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}

function goUnit(){const tl=[["dict","🖼️","#0e7c86"],["cards","🃏","#7a3cff"],["sents","💬","#c2410c"],["games","🎮","#237a37"]];
 paint(`<h1>${U[S.unit].e} ${TOPIC[S.lang]}</h1>${say2(t(S.unit=="animals"?"hi":"hi3"))}
 <div class="panel"><h2>🎯 ${t("goals")}</h2><p>🧠 ${t("gu1").replace("{n}",W.length)}</p>${P.slice(0,2).map(p=>`<p>🗣️ ${t("gu2").replace("{s}",p.en)}</p>`).join("")}</div>
 <div class="grid">${tl.map(([k,i,c])=>`<button class="tile" style="background:${c}" onclick="show(go${k[0].toUpperCase()+k.slice(1)})"><i>${i}</i>${t(k)}</button>`).join("")}</div><div class="row" style="flex-wrap:wrap">${CFG.daily=="1"?`<button class="big" onclick="runTask(1,pickW(5))" aria-label="Daily">☀️ 5</button>`:""}<button class="big" onclick="show(goTasks)">🎯 ${t("tasks")}</button><button class="big" onclick="show(goTest)">📝 ${t("test")}</button><button class="big" onclick="show(goProg)">📈 ${t("prog")}</button></div>`)}

// Раздел 1. Визуальный словарь
const card=x=>`<div class="wc">${pic(x,"s")}<div style="flex:1"><h3>${x.en} ${x.ipa?"<small>/"+x.ipa+"/</small>":""}</h3>${hints(x)}<p>${x.ex}</p>${x.ctx?`<p>${x.ctx}</p>`:""}</div><div>${spk(x)}</div></div>`;
function goDict(){paint(`<input id="q" type="search" placeholder="🔍 ${t("search")}" aria-label="${t("search")}" oninput="dl()"><div id="dl"></div>
 <h2>💬 ${t("phr")}</h2>${P.map((p,i)=>`<div class="wc"><div style="flex:1"><h3>${p.en}</h3>${hints(p)}</div>${canSay(S.acc)?`<button class="sp" onclick="sayP(${i})" aria-label="Audio">🔊</button>`:""}</div>`).join("")}`);dl()}
function dl(){const q=$("#q").value.toLowerCase();$("#dl").innerHTML=W.filter(x=>(x.en+x.ru+x.kk).toLowerCase().includes(q)).map(card).join("")}

// Раздел 2. Флешкарты (система Лейтнера: коробки 1-5, повтор через 0/1/3/7/14 дней)
let fc;const GAP=[0,1,3,7,14];
const due=()=>sh(W.filter(x=>!S.box[x.en]||S.box[x.en].d<=today())).slice(0,10);
function goCards(){paint(`${say2(t("cards"))}${["🔤","🖼️","🔊"].map((i,n)=>`<button class="big" onclick="startFc(${n})">${i} ${t("m"+(n+1))}</button>`).join("")}`)}
function startFc(m){const q=due();if(!q.length)return paint(say2(t("none"))+homeBtn());
 if(m==2)return quiz("hear",q,fin("hear"));fc={m,q,i:0,f:0};cur=fcShow;fcShow()}
function fcShow(){if(fc.i>=fc.q.length){confetti();return paint(say2(t("done"))+homeBtn())}
 const x=fc.q[fc.i];
 paint(`<div class="meta">${fc.i+1}/${fc.q.length}</div>
 <div class="card3d" tabindex="0" role="button" aria-label="${t("flip")}" onclick="flipC()" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();flipC()}">
 <div class="in" id="in"><div class="face">${pic(x)}${fc.m==0?`<h2>${x.en}</h2>`:""}<small>${t("flip")}</small></div>
 <div class="face back">${fc.m==1?`<h2>${x.en}</h2>`:""}${x.ipa?"<small>/"+x.ipa+"/</small>":""}${hints(x)}<p>${x.ex}</p></div></div></div>
 <div style="text-align:center">${spk(x)}</div>
 <div class="row"><button class="big no" onclick="rate(0)">↻ ${t("again")}</button><button class="big yes" onclick="rate(1)">✓ ${t("know")}</button></div>`)}
function flipC(){$("#in").classList.toggle("f")}
function rate(g){const x=fc.q[fc.i],b=S.box[x.en]||{b:1};b.b=g?Math.min(5,b.b+1):1;b.d=today()+(g?GAP[b.b-1]:0);S.box[x.en]=b;save();beep(g);fc.i++;fcShow()}

// Тесты: входной (без оценок) и итоговый; тот же движок — для режима «слушай → выбирай»
function quiz(kind,ws,after){
 const can=x=>x.audio||canSay("en");
 const Q=sh(ws).map((x,i)=>({x,hear:(kind=="hear"||(kind!="pic"&&i%2))&&can(x),o:0}));
 let i=0,k=0,miss=[],lock=0;cur=null;AD={n:4,w:0,r:0,h:0};
 const step=()=>{if(i>=Q.length)return after(k,Q.length,miss);const q=Q[i];q.o=opts(q.x);lock=0;
  paint(`<div class="meta">${i+1}/${Q.length}</div>${q.hear?`<button class="big" onclick="say(${W.indexOf(q.x)},'en')" aria-label="Audio">🔊</button>`:`${pic(q.x)}`}
  <div class="grid">${q.o.map((o,j)=>`<button class="opt" id="o${j}" onclick="pk(${j})">${q.hear?`${pic(o,"s")}`:o.en}</button>`).join("")}</div>${say2(kind=="pre"?"🙂":AD.h&&!q.hear?"💡 "+q.x.en[0]+"…":"👆")}`);
  if(q.hear&&S.snd=="1")say(W.indexOf(q.x),"en")};
 window.pk=j=>{if(lock)return;lock=1;const q=Q[i],good=q.o[j]==q.x;
  if(kind!="pre"){const mark=(n,c,s)=>{const b=$("#o"+n);b.classList.add(c);b.insertAdjacentHTML("afterbegin",s)};
   mark(j,good?"yes":"no",good?"✓ ":"✗ ");if(!good)mark(q.o.indexOf(q.x),"yes","✓ ");$("#bub").textContent=t(good?"ok":"no");beep(good)}
  if(kind!="pre"&&kind!="fin")adj(good);good?k++:miss.push(q.x);i++;setTimeout(step,kind=="pre"?300:1200)};
 step()}
const fin=kind=>(k,n,miss)=>{if(kind=="pre")S.pre={k,n};if(kind=="fin")S.post={k,n};

// 2. Соедини слово и картинку (группы по 4 пары)

 const board=()=>{if(g>=G.length)return after(k,L.length,miss);const ws=G[g];let sel=null,left=ws.length;const bad=new Set(),ix=x=>W.indexOf(x);

// 1. Найди пару: лёгкий уровень — в начале карточки ненадолго открыты

// 2. Лопни шарики: первые 2 раунда всегда с 3 шариками; неверный шарик просто тускнеет

 const step=()=>{if(i>=L.length)return end(k,L.length,miss);const x=L[i];o=opts(x,i<2?3:[3,4,6][lv]);lock=0;wr=0;

// 3. Накорми монстрика: «I want a cat!» → нужную карточку к монстрику

// переключение темы: текущие слова/фразы возвращаются в U, прогресс по теме (тесты, звёзды) хранится отдельно
function useU(id,boot){if(!boot){const o=U[S.unit];o.words=W.slice();o.phr=P.slice();o.dlg=DLG.slice()}
 S.U[S.unit]={pre:S.pre,post:S.post,stars:S.stars};const n=U[id],p=S.U[id]||{pre:null,post:null,stars:{}};
 S.unit=id;S.pre=p.pre;S.post=p.post;S.stars=p.stars;
 W.splice(0,W.length,...n.words);P.splice(0,P.length,...n.phr);DLG.splice(0,DLG.length,...n.dlg);TOPIC=n.n;CN=n.cn;
 for(const k in CAT)delete CAT[k];W.forEach(x=>{if(x.c)CAT[x.en]=x.c})}
function pickU(id){useU(id);save();show(goUnit)}
// ГЛАВНАЯ: меню тем (клик по теме открывает её раздел со словарём, карточками, заданиями и играми)
function goHome(){paint(`<h1>🎓 ${t("pt")}</h1>${say2(t("hi2"))}<div class="grid">${UL.map(id=>{const u=U[id];
 if(u.soon)return `<button class="tile" disabled style="background:${u.col}"><i>${u.e}</i>${u.n[S.lang]}<small>🔒 ${t("soon")}</small></button>`;
 const ws=id==S.unit?W:u.words;return `<button class="tile" style="background:${u.col}" onclick="pickU('${id}')"><i>${u.e}</i>${u.n[S.lang]}<small>📚 ${ws.filter(x=>(S.box[x.en]||{b:0}).b>=3).length}/${ws.length}</small></button>`}).join("")}</div>`)}

/* ===== ЗАПУСК ===== */
try{speechSynthesis.onvoiceschanged=()=>{if(cur)cur()}}catch(e){}
load();useU(U[S.unit]&&!U[S.unit].soon?S.unit:"animals",1);apply();hdr();show(goHome);
/* ===== РЕЖИМ УЧИТЕЛЯ и ИГРЫ — будут добавлены на следующих этапах ===== */
</script></body></html>
